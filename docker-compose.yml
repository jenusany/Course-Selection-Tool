services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wcs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcs
      POSTGRES_PASSWORD: wcs_dev_password
      POSTGRES_DB: wcs
    ports:
      - "5432:5432"
    volumes:
      - wcs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcs -d wcs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wcs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wcs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wcs_postgres_data:
  wcs_redis_data:
